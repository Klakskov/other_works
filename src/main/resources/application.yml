spring:
  datasource:
    url: jdbc:h2:mem:pricesdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true


server:
  port: 8080